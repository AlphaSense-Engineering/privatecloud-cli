version: "2"
linters:
  default: none
  enable:
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - forcetypeassert
    - funlen
    - gocognit
    - goconst
    - gocyclo
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
    - wsl_v5
  settings:
    gocognit:
      min-complexity: 25
    goconst:
      min-len: 2
      min-occurrences: 2
    lll:
      line-length: 160
      tab-width: 4
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - goconst
      - path: _test\.go
        linters:
          - gosec
        text: G101
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
